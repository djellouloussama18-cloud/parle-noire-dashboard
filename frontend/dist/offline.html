<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <title>غير متصل | Parle Noire</title>

    .icon svg { width: 40px; height: 40px; fill: none; stroke: #10b981; stroke-width: 2; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; }
    p { color: #94A3B8; line-height: 1.7; font-size: 0.95rem; }
    .badge { display: inline-block; margin-top: 2rem; padding: 0.4rem 1rem; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); border-radius: 999px; font-size: 0.75rem; color: #10b981; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 2v8m0 0l-3-3m3 3l3-3M5 12v6a2 2 0 002 2h10a2 2 0 002-2v-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>أنت غير متصل بالإنترنت</h1>

  </div>
</body>
</html>
